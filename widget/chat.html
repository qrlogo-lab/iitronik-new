<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Итроник Чат</title>
	<script src="/assets/js/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px;
            color: white;
            text-align: center;
            flex-shrink: 0;
        }

        .chat-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-6px);
            }
        }

        .chat-input {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 15px;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        #sendButton {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            background: #0056b3;
            transform: scale(1.05);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .welcome-message h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .welcome-message p {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <h2>💬 Спросите у Итроника</h2>
        <p>Ваш цифровой консультант</p>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="welcome-message">
            <h3>👋 Привет!</h3>
            <p>Я могу ответить на вопросы о создании вашего цифрового двойника.<br>Задайте любой вопрос!</p>
        </div>
    </div>

    <div class="chat-input">
        <div class="input-wrapper">
            <input 
                id="messageInput" 
                type="text" 
                placeholder="Напишите сообщение..."
                maxlength="500"
            />
            <button id="sendButton">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        class ChatWidget {
            constructor() {
                this.messages = [];
                this.conversationId = null;
                this.sessionId = this.getOrCreateSessionId();
                this.isProcessing = false;
                
                this.messagesContainer = document.getElementById('chatMessages');
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                
                this.init();
            }

            getOrCreateSessionId() {
                let sid = localStorage.getItem('itronik_session');
                if (!sid) {
                    sid = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('itronik_session', sid);
                }
                return sid;
            }

            init() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Приветственное сообщение
                setTimeout(() => {
                    this.addMessage('assistant', 'Здравствуйте! Я Итроник - цифровой помощник. Чем могу помочь?');
                }, 1000);
            }

            addMessage(role, content, isTyping = false) {
                // Убираем welcome message
                const welcome = this.messagesContainer.querySelector('.welcome-message');
                if (welcome) welcome.remove();

                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${role}`;
                
                if (isTyping) {
                    messageDiv.id = 'typing-indicator';
                    messageDiv.innerHTML = `
                        <div class="message-bubble">
                            <div class="typing-indicator">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                    `;
                } else {
                    const bubble = document.createElement('div');
                    bubble.className = 'message-bubble';
                    bubble.textContent = content;
                    messageDiv.appendChild(bubble);
                    
                    this.messages.push({ role, content });
                    
                    // Уведомляем родительское окно
                    if (role === 'assistant') {
                        window.parent.postMessage({
                            type: 'itronik_new_message',
                            content: content
                        }, '*');
                    }
                }
                
                this.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
            }

            removeTypingIndicator() {
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
            }

            scrollToBottom() {
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            async sendMessage() {
                const message = this.messageInput.value.trim();
                
                if (!message || this.isProcessing) return;

                this.isProcessing = true;
                this.sendButton.disabled = true;

                this.addMessage('user', message);
                this.messageInput.value = '';

                this.addMessage('assistant', '', true);

                try {
                    const response = await fetch('/api.php?action=widget_send', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            session_id: this.sessionId,
                            message: message,
                            conversation_id: this.conversationId
                        })
                    });

                    this.removeTypingIndicator();

                    if (!response.ok) {
                        throw new Error('Ошибка сервера');
                    }

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }

                    const assistantMessage = data.response || 'Извините, не смог обработать ваш запрос.';
                    
                    this.addMessage('assistant', assistantMessage);

                    if (data.conversation_id) {
                        this.conversationId = data.conversation_id;
                    }

                } catch (error) {
                    this.removeTypingIndicator();
                    console.error('Chat error:', error);
                    this.addMessage('assistant', 'Извините, произошла ошибка. Попробуйте ещё раз.');
                } finally {
                    this.isProcessing = false;
                    this.sendButton.disabled = false;
                    this.messageInput.focus();
                }
            }
        }

        // Инициализация
        const chat = new ChatWidget();
    </script>
</body>
</html>
