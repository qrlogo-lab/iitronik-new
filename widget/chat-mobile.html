<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ИТРОНИК – Трамп</title>

  <!-- Marked.js для парсинга Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify для безопасности -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0033;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .chat-widget {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: transparent;
      position: relative;
      overflow: hidden;
    }

    /* ===== ШАПКА (тёмная, как у сайта) ===== */
    .agent-header {
      flex-shrink: 0;
      padding: 12px 16px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: linear-gradient(135deg, var(--agent-primary, #ff00c8), var(--agent-secondary, #ff6b9d));
      flex-shrink: 0;
      position: relative;
    }
    .agent-avatar::after {
      content: '';
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
      border: 2px solid #0a0033;
    }

    .agent-info {
      flex: 1;
      min-width: 0;
    }
    .agent-name {
      font-size: 16px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-status {
      font-size: 11px;
      color: #4ade80;
    }

    /* ===== ОБЛАСТЬ СООБЩЕНИЙ (светлая, как WhatsApp) ===== */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      background: #e5ddd5;
      background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%239C92AC" fill-opacity="0.08"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
      background-repeat: repeat;
    }
    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

    /* ===== СООБЩЕНИЯ ===== */
    .message-row {
      display: flex;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-row.user { justify-content: flex-end; }
    .message-row.bot { justify-content: flex-start; padding-left: 44px; }

    .message-bubble {
      max-width: 85%;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      position: relative;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }

    /* Сообщения пользователя (остаются цветными) */
    .message-row.user .message-bubble {
      background: linear-gradient(135deg, #ff00c8, #ff6b9d);
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Сообщения бота (светлые, как в мессенджере) */
    .message-row.bot .message-bubble {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }
    .message-row.bot .message-bubble::before {
      content: attr(data-avatar);
      position: absolute;
      left: -38px;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--agent-primary, #ff00c8), var(--agent-secondary, #ff6b9d));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* ===== СТИЛИ ДЛЯ MARKDOWN (адаптированы под светлый фон) ===== */
    .message-row.bot .message-bubble h1,
    .message-row.bot .message-bubble h2,
    .message-row.bot .message-bubble h3 {
      margin: 10px 0 6px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .message-row.bot .message-bubble h1 { font-size: 18px; }
    .message-row.bot .message-bubble h2 { font-size: 16px; }
    .message-row.bot .message-bubble h3 { font-size: 14px; }
    .message-row.bot .message-bubble p { margin: 6px 0; color: #1a1a1a; }
    .message-row.bot .message-bubble ul,
    .message-row.bot .message-bubble ol { margin: 6px 0; padding-left: 20px; color: #1a1a1a; }
    .message-row.bot .message-bubble li { margin: 3px 0; color: #1a1a1a; }
    .message-row.bot .message-bubble strong {
      font-weight: 600;
      color: var(--agent-primary, #ff00c8);
    }
    .message-row.bot .message-bubble em { font-style: italic; color: #1a1a1a; }
    .message-row.bot .message-bubble code {
      background: rgba(0,0,0,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      color: #1a1a1a;
    }
    .message-row.bot .message-bubble pre {
      background: rgba(0,0,0,0.06);
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .message-row.bot .message-bubble pre code { background: none; padding: 0; }
    .message-row.bot .message-bubble a {
      color: var(--agent-primary, #ff00c8);
      text-decoration: underline;
    }
    .message-row.bot .message-bubble blockquote {
      border-left: 3px solid var(--agent-primary, #ff00c8);
      padding-left: 12px;
      opacity: 0.7;
      margin: 8px 0;
      color: #1a1a1a;
    }
    .message-row.user .message-bubble a { color: white; }

    /* ===== МАСШТАБИРОВАНИЕ ИЗОБРАЖЕНИЙ ===== */
    .message-bubble img {
      max-width: 100% !important;
      height: auto !important;
      border-radius: 8px;
      display: block;
      margin: 8px 0;
    }
    .message-bubble img[style*="width"] {
      width: 100% !important;
      max-width: 100% !important;
    }
    .message-bubble p img {
      max-width: 100% !important;
      height: auto !important;
    }
    .message-bubble table {
      max-width: 100% !important;
      display: block;
      overflow-x: auto;
    }
    .message-bubble pre {
      max-width: 100% !important;
      overflow-x: auto !important;
    }

    /* ===== ИНТЕРАКТИВНЫЕ КНОПКИ В СООБЩЕНИЯХ ===== */
    .inline-action-btn {
      display: inline-block;
      padding: 10px 20px;
      margin: 6px 4px;
      background: linear-gradient(135deg, var(--agent-primary, #ff00c8), var(--agent-secondary, #ff6b9d));
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(255,0,200,0.2);
      text-align: center;
      min-width: 60px;
    }

    .inline-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(255,0,200,0.4);
    }

    .inline-action-btn:active {
      transform: scale(0.95);
    }

    /* Кнопки в сообщениях бота (на светлом фоне) */
    .message-row.bot .inline-action-btn {
      background: linear-gradient(135deg, var(--agent-primary, #ff00c8), var(--agent-secondary, #ff6b9d));
      color: white;
    }

    /* Группа кнопок в ряд */
    .inline-action-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .message-row.bot .inline-action-btn-group {
      justify-content: flex-start;
    }

    /* Контейнер для кнопок */
    .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    /* Индикатор набора (тёмные точки на светлом фоне) */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.3);
      animation: bounce 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ===== ВВОД СООБЩЕНИЯ (тёмный, в стиле сайта) ===== */
    .input-area {
      flex-shrink: 0;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 12px));
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
      z-index: 10;
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-wrapper input {
      flex: 1;
      padding: 12px 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      outline: none;
      font-size: 14.5px;
      color: white;
      font-family: inherit;
      transition: 0.2s;
      min-height: 48px;
    }
    .input-wrapper input:focus {
      border-color: var(--agent-primary, #ff00c8);
      background: rgba(255,255,255,0.12);
    }
    .input-wrapper input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--agent-primary, #ff00c8), var(--agent-secondary, #ff6b9d));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.25s;
      box-shadow: 0 4px 15px rgba(255,0,200,0.3);
    }
    .send-btn:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 6px 22px rgba(255,0,200,0.45);
    }
    .send-btn:active:not(:disabled) { transform: scale(0.95); }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    .send-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Фиксируем поле ввода при фокусе на мобильных */
    @media screen and (max-width: 480px) {
      .chat-widget {
        position: relative;
      }
      
      .input-area {
        position: sticky;
        bottom: 0;
        background: rgba(0,0,0,0.9);
        backdrop-filter: blur(20px);
      }
      
      .message-bubble { font-size: 13.5px; }
      .input-wrapper input { font-size: 14px; padding: 10px 14px; }
      .send-btn { width: 44px; height: 44px; }
      .inline-action-btn {
        font-size: 13px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

<div class="chat-widget" id="chatWidget">

  <!-- ШАПКА -->
  <div class="agent-header">
    <div class="agent-avatar" id="agentAvatar">🇺🇸</div>
    <div class="agent-info">
      <div class="agent-name" id="agentName">Дональд Трамп</div>
      <div class="agent-status">● онлайн</div>
    </div>
  </div>

  <!-- СООБЩЕНИЯ -->
  <div class="messages-area" id="messagesArea"></div>

  <!-- ВВОД -->
  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="messageInput" placeholder="Задайте вопрос..." maxlength="500" />
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  // ====================================================================
  // 1. ПОЛУЧАЕМ ПАРАМЕТРЫ ИЗ URL
  // ====================================================================
  const urlParams = new URLSearchParams(window.location.search);
  const agentId = urlParams.get('agent_id') || 'agent_cAg5T0OgoYgl9L07mbbpE';
  const agentName = urlParams.get('agent_name') || 'Дональд Трамп';

  // Устанавливаем аватар и цвета в зависимости от имени
  let avatar = '🇺🇸';
  let primaryColor = '#ff00c8';
  let secondaryColor = '#ff6b9d';
  if (agentName.toLowerCase().includes('захарьев')) {
    avatar = '🧠';
    primaryColor = '#21d4fd';
    secondaryColor = '#6366f1';
  }

  document.documentElement.style.setProperty('--agent-primary', primaryColor);
  document.documentElement.style.setProperty('--agent-secondary', secondaryColor);
  document.getElementById('agentAvatar').textContent = avatar;
  document.getElementById('agentName').textContent = agentName;

  // ====================================================================
  // 2. КЛАСС ЧАТА С ПОДДЕРЖКОЙ КНОПОК
  // ====================================================================
  class ItronikChat {
    constructor() {
      this.agentId = agentId;
      this.agentName = agentName;
      this.messages = [];
      this.conversationId = null;
      this.sessionId = this.getOrCreateSessionId();
      this.isProcessing = false;
      this.lastMessageId = 0;
      this.pollInterval = null;
      this.historyLoaded = false;
      this.avatar = avatar;

      this.messagesArea = document.getElementById('messagesArea');
      this.messageInput = document.getElementById('messageInput');
      this.sendBtn = document.getElementById('sendBtn');

      // Настройка marked
      if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
      }

      // События
      this.sendBtn.addEventListener('click', () => this.sendMessage());
      this.messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          this.sendMessage();
        }
      });

      // Отправляем событие при фокусе на поле ввода
      this.messageInput.addEventListener('focus', () => {
        this.notifyParentAboutInteraction();
      });

      this.messageInput.addEventListener('click', () => {
        this.notifyParentAboutInteraction();
      });

      this.init();
    }

    // ===== Уведомляем родительское окно о взаимодействии =====
    notifyParentAboutInteraction() {
      if (window.parent !== window) {
        try {
          window.parent.postMessage({ type: 'widget_interaction' }, '*');
        } catch (e) {
          // Игнорируем ошибки CORS
        }
      }
    }

    getOrCreateSessionId() {
      let sid = localStorage.getItem('itronik_session_mobile');
      if (!sid) {
        sid = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('itronik_session_mobile', sid);
      }
      return sid;
    }

    async init() {
      await this.loadHistory();

      if (!this.historyLoaded) {
        setTimeout(() => {
          this.addMessage('assistant', `Здравствуйте! Я ${this.agentName}. Чем могу помочь?`, false, true);
        }, 300);
      }

      this.startPolling();
      
      // Отправляем событие о готовности через 1 секунду
      setTimeout(() => {
        this.notifyParentAboutInteraction();
      }, 1000);
    }

    async loadHistory() {
      try {
        const response = await fetch(`/api.php?action=widget_history&session_id=${this.sessionId}&agent_id=${this.agentId}`);
        const data = await response.json();

        if (data.conversation_id) {
          this.conversationId = data.conversation_id;
        }

        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(msg => {
            this.addMessage(msg.role, msg.content, false, true);
            if (msg.id > this.lastMessageId) {
              this.lastMessageId = msg.id;
            }
          });
          this.historyLoaded = true;
        }
      } catch (error) {
        console.error('Failed to load history:', error);
      }
    }

    startPolling() {
      if (this.pollInterval) return;
      this.pollInterval = setInterval(() => this.checkNewMessages(), 3000);
    }

    stopPolling() {
      if (this.pollInterval) {
        clearInterval(this.pollInterval);
        this.pollInterval = null;
      }
    }

    async checkNewMessages() {
      if (this.isProcessing) return;

      try {
        const response = await fetch(
          `/api.php?action=widget_poll&session_id=${this.sessionId}&agent_id=${this.agentId}&last_message_id=${this.lastMessageId}`
        );
        const data = await response.json();

        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(msg => {
            if (msg.role === 'assistant') {
              this.addMessage('assistant', msg.content, false, true);
            }
            if (msg.id > this.lastMessageId) {
              this.lastMessageId = msg.id;
            }
          });
        }
      } catch (error) {
        // игнорируем
      }
    }

    // ===== ПАРСИНГ ИНТЕРАКТИВНЫХ КНОПОК ИЗ MARKDOWN =====
    parseButtonsFromMarkdown(content) {
      // Ищем кнопки в формате [Текст](button:запрос)
      const buttonRegex = /\[([^\]]+)\]\(button:([^)]+)\)/g;
      let match;
      let html = content;

      // Находим все кнопки
      const buttonMatches = [];
      while ((match = buttonRegex.exec(content)) !== null) {
        buttonMatches.push({
          full: match[0],
          text: match[1],
          query: match[2].trim()
        });
      }

      // Заменяем каждую кнопку на HTML
      buttonMatches.forEach((btn) => {
        const buttonHtml = `<button class="inline-action-btn" data-query="${this.escapeHtml(btn.query)}" onclick="chatInstance.handleInlineButton('${this.escapeHtml(btn.query)}')">${this.escapeHtml(btn.text)}</button>`;
        html = html.replace(btn.full, buttonHtml);
      });

      return html;
    }

    escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== ОБРАБОТЧИК НАЖАТИЯ НА КНОПКУ =====
    handleInlineButton(query) {
      // Отправляем запрос как сообщение пользователя
      this.messageInput.value = query;
      this.sendMessage();
    }

    addMessage(role, content, isTyping = false, skipPush = false) {
      const row = document.createElement('div');
      row.className = `message-row ${role === 'user' ? 'user' : 'bot'}`;

      if (isTyping) {
        row.id = 'typing-indicator';
        row.innerHTML = `
          <div class="message-bubble" data-avatar="${this.avatar}">
            <div class="typing-indicator"><span></span><span></span><span></span></div>
          </div>
        `;
      } else {
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.setAttribute('data-avatar', this.avatar);

        if (role === 'assistant') {
          // Сначала парсим Markdown
          let rawHtml = marked.parse(content);
          // Затем заменяем кнопки
          rawHtml = this.parseButtonsFromMarkdown(rawHtml);
          // Очищаем через DOMPurify для безопасности
          if (typeof DOMPurify !== 'undefined') {
            bubble.innerHTML = DOMPurify.sanitize(rawHtml, {
              ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'h4', 'code', 'pre', 'blockquote', 'a', 'img', 'button', 'div', 'span'],
              ALLOWED_ATTR: ['href', 'src', 'alt', 'class', 'onclick', 'data-query', 'style']
            });
          } else {
            bubble.innerHTML = rawHtml;
          }
        } else {
          bubble.textContent = content;
        }

        row.appendChild(bubble);

        if (!skipPush) {
          this.messages.push({ role, content });
        }
      }

      this.messagesArea.appendChild(row);
      this.scrollToBottom();
    }

    removeTypingIndicator() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    scrollToBottom() {
      this.messagesArea.scrollTop = this.messagesArea.scrollHeight;
    }

    async sendMessage() {
      const message = this.messageInput.value.trim();
      if (!message || this.isProcessing) return;

      // Уведомляем родителя о взаимодействии
      this.notifyParentAboutInteraction();

      this.isProcessing = true;
      this.sendBtn.disabled = true;

      this.addMessage('user', message);
      this.messageInput.value = '';
      this.addMessage('assistant', '', true);

      try {
        const response = await fetch('/api.php?action=widget_send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            session_id: this.sessionId,
            message: message,
            conversation_id: this.conversationId,
            agent_id: this.agentId,
            agent_name: this.agentName
          })
        });

        this.removeTypingIndicator();

        if (!response.ok) {
          throw new Error('Ошибка сервера');
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        const assistantMessage = data.response || 'Извините, не смог обработать ваш запрос.';
        this.addMessage('assistant', assistantMessage);

        if (data.conversation_id) {
          this.conversationId = data.conversation_id;
        }
        if (data.message_id) {
          this.lastMessageId = data.message_id;
        }

      } catch (error) {
        this.removeTypingIndicator();
        console.error('Chat error:', error);
        this.addMessage('assistant', '⚠️ Произошла ошибка. Попробуйте ещё раз.');
      } finally {
        this.isProcessing = false;
        this.sendBtn.disabled = false;
        this.messageInput.focus();
      }
    }
  }

  // ====================================================================
  // 3. ЗАПУСК
  // ====================================================================
  let chatInstance;
  document.addEventListener('DOMContentLoaded', () => {
    chatInstance = new ItronikChat();
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'itronik_widget_ready' }, '*');
    }
  });
</script>
</body>
</html>
